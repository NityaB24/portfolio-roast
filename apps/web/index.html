<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Portfolio Roast</title>
    <meta name="description" content="Paste your portfolio URL. Get a brutal, specific critique, a score out of 100 and a spot on the leaderboard." />
    <!--OG-->
    <meta property="og:title" content="Portfolio Roast" />
    <meta property="og:description" content="Paste your portfolio URL. Get a brutal, specific critique, a score out of 100 and a spot on the leaderboard." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--/OG-->
    <meta name="theme-color" content="#FBFAF8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#121110" : "#FBFAF8");
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
